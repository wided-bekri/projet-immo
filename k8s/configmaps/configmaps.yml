# ConfigMaps Kubernetes — Compagnon Immobilier
# Variables d'environnement non-sensibles

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immo-api-config
  namespace: immo
data:
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immo-airflow-config
  namespace: immo
data:
  AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres-service/airflow"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immo-streamlit-config
  namespace: immo
data:
  API_URL: "http://api-service:8000"
  AIRFLOW_URL: "http://airflow-webserver-service:8080"
  PROMETHEUS_URL: "http://prometheus-service:9090"
