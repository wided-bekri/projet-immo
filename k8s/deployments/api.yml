apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: immo
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: immo-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: immo-api-config
          env:
            - name: IMMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: immo-api-secret
                  key: IMMO_API_KEY
          command: ["uvicorn", "src.services.inference.inference_service:app",
                    "--host", "0.0.0.0", "--port", "8000"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
