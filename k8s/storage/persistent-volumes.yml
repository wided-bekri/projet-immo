# Persistent Volumes — Compagnon Immobilier
# Stockage persistant pour MLflow, PostgreSQL, Grafana, Airflow

---
# PV MLflow (modèles et artifacts)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mlflow-pv
spec:
  storageClassName: local-path
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: immo
    name: mlflow-pvc
  hostPath:
    path: "/mnt/immo/mlflow"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: immo
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

