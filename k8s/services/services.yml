# Services Kubernetes — Compagnon Immobilier
# ClusterIP = interne au cluster
# NodePort   = accessible depuis l'extérieur

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: immo
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: immo
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-service
  namespace: immo
spec:
  type: NodePort
  selector:
    app: streamlit
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30501

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: immo
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver-service
  namespace: immo
spec:
  type: NodePort
  selector:
    app: airflow-webserver
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: immo
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30090

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: immo
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30030
