# Secrets Kubernetes — Compagnon Immobilier
# Les valeurs sont encodées en base64
# echo -n 'valeur' | base64

---
apiVersion: v1
kind: Secret
metadata:
  name: immo-api-secret
  namespace: immo
type: Opaque
data:
  # echo -n 'your-api-key-here' | base64
  IMMO_API_KEY: eW91ci1hcGkta2V5LWhlcmU=

---
apiVersion: v1
kind: Secret
metadata:
  name: immo-airflow-secret
  namespace: immo
type: Opaque
data:
  # echo -n 'airflow' | base64
  POSTGRES_USER: YWlyZmxvdw==
  POSTGRES_PASSWORD: YWlyZmxvdw==
  POSTGRES_DB: YWlyZmxvdw==
  # echo -n 'compagnon-immo-secret' | base64
  AIRFLOW_SECRET_KEY: Y29tcGFnbm9uLWltbW8tc2VjcmV0

---
apiVersion: v1
kind: Secret
metadata:
  name: immo-grafana-secret
  namespace: immo
type: Opaque
data:
  # echo -n 'admin' | base64
  GF_SECURITY_ADMIN_PASSWORD: YWRtaW4=
